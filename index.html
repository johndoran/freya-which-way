<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which way? A college decision workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --ink:#18212B; --muted:#5B6672; --line:#D9DFDC; --soft:#E7EDEA;
  --accent:#18212B; --accent-ink:#FFFFFF;
  --dcu:#B35F00; --marino:#1D7A52; --tcd:#3556A8;
  --dcu-soft:#FBEBD3; --marino-soft:#D9F0E4; --tcd-soft:#DEE6F8;
  --warn-bg:#FFF4D9; --warn-line:#E5BF62;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161C; --surface:#18212A; --ink:#EDF1F3; --muted:#9CA8B3; --line:#2B3742; --soft:#202B35;
    --accent:#EDF1F3; --accent-ink:#10161C;
    --dcu:#F0A650; --marino:#5CCB98; --tcd:#8FA9EC;
    --dcu-soft:#3B2A12; --marino-soft:#123224; --tcd-soft:#1E2A4A;
    --warn-bg:#352B14; --warn-line:#6E5A24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --ink:#EDF1F3; --muted:#9CA8B3; --line:#2B3742; --soft:#202B35;
  --accent:#EDF1F3; --accent-ink:#10161C;
  --dcu:#F0A650; --marino:#5CCB98; --tcd:#8FA9EC;
  --dcu-soft:#3B2A12; --marino-soft:#123224; --tcd-soft:#1E2A4A;
  --warn-bg:#352B14; --warn-line:#6E5A24;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3rem);font-weight:700}
h2{font-size:clamp(1.5rem,4.2vw,2rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 .8em;max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--tcd);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:18px 16px 56px}

/* header + steps */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.05rem}
.steps{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 12px;margin-bottom:6px;scrollbar-width:thin}
.steps button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;color:var(--muted);white-space:nowrap}
.steps button[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.steps button.done{color:var(--ink)}
.mode{display:flex;gap:0;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.mode button{border:0;background:none;padding:6px 12px;font-size:.85rem;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}

/* panels */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px;margin-bottom:16px}
.lede{font-size:1.1rem;color:var(--muted)}
.banner{background:var(--tcd-soft);border:1.5px solid var(--tcd);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:.95rem}
.banner.parent{background:var(--warn-bg);border-color:var(--warn-line)}

/* questions */
.q{padding:18px 0;border-top:1.5px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.q .t{font-weight:600;margin-bottom:4px;max-width:58ch}
.q .h{color:var(--muted);font-size:.92rem;margin-bottom:10px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.sc button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 0;font-weight:600;font-size:1.05rem;min-height:48px;transition:background .12s,border-color .12s,transform .12s}
.sc button:hover{border-color:var(--ink)}
.sc button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translateY(-2px)}
.ends{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:6px}
.field{margin:0 0 20px}
.field label{display:block;font-weight:600;margin-bottom:6px;max-width:58ch}
textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:92px;resize:vertical}

/* nav */
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:8px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 22px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{padding:7px 14px;font-size:.9rem}
.btn:hover{filter:brightness(1.12)}

/* ranking + cao rows */
.rows{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg)}
.row .pos{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.3rem;width:1.6rem;text-align:center;flex:none}
.row .body{flex:1;min-width:0}
.row .name{font-weight:600}
.row .sub{font-size:.88rem;color:var(--muted)}
.row .ctl{display:flex;gap:4px;flex:none}
.ic{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;font-size:1rem}
.ic:hover{border-color:var(--ink)}
.chip{display:inline-block;font-size:.78rem;border-radius:999px;padding:1px 9px;background:var(--soft);margin:3px 4px 0 0;color:var(--muted)}
.dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:6px}

/* results */
.score{border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;background:var(--bg)}
.score header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.score .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:2.2rem}
.score .num small{font-size:1rem;color:var(--muted);font-weight:500}
.bar{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;border-radius:999px;transition:width .5s}
.score ul{margin:.2em 0 .6em;padding-left:1.1em}
.score li{margin:.15em 0}
.callout{border-left:5px solid var(--warn-line);background:var(--warn-bg);border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:12px}
.callout strong{display:block;margin-bottom:2px}
.callout p{margin:.2em 0}
.ask{font-style:italic;color:var(--muted)}
.quote{border-left:4px solid var(--line);padding:2px 12px;margin:6px 0;color:var(--muted);white-space:pre-wrap}
details{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--bg)}
summary{cursor:pointer;font-weight:600}
details p{margin-top:8px}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1.5px solid var(--line);cursor:pointer}
.checks label:first-child{border-top:0}
.checks input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--marino)}
.checks .done{color:var(--muted);text-decoration:line-through}
.checks small{display:block;color:var(--muted)}
.opts{display:grid;gap:10px;margin:16px 0}
@media (min-width:640px){.opts{grid-template-columns:repeat(3,1fr)}}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;border-top-width:6px;background:var(--bg)}
.opt b{display:block;margin-bottom:2px}
.opt span{font-size:.9rem;color:var(--muted)}
textarea.summary{min-height:260px;font-size:.9rem}
.note{font-size:.9rem;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-weight:600}
.tabs button[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.glance{display:grid;gap:10px;margin:14px 0}
@media (min-width:640px){.glance{grid-template-columns:repeat(3,1fr)}}
.g{border:1.5px solid var(--line);border-top-width:6px;border-radius:14px;padding:12px 14px;background:var(--bg)}
.g .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.9rem;line-height:1.1;margin-top:2px}
.g .big small{display:block;font-family:"Figtree",sans-serif;font-size:.85rem;color:var(--muted);font-weight:500}
.g dl{margin:8px 0 0}.g dt{font-size:.8rem;color:var(--muted)}.g dd{margin:0 0 6px;font-size:.93rem}
.kv h3{margin-top:20px}
.kv ul{margin:.3em 0 .8em;padding-left:1.2em}.kv li{margin:.3em 0;max-width:64ch}
a{color:var(--tcd);text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
.links a{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.92rem;text-decoration:none;color:var(--ink);background:var(--bg)}
.links a:hover{border-color:var(--ink)}
.tl .when{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.15rem;margin-top:26px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.tl .when small{display:block;font-family:"Figtree",sans-serif;font-weight:400;color:var(--muted);font-size:.88rem}
.lanes{display:grid;gap:8px;margin-top:8px}
@media (min-width:700px){.lanes{grid-template-columns:repeat(3,1fr)}}
.lane{border-left:6px solid var(--line);padding:8px 12px;font-size:.93rem;background:var(--bg);border-radius:0 12px 12px 0}
.lane b{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:2px}
.day{border:1.5px solid var(--line);border-top-width:6px;border-radius:14px;padding:12px 14px;background:var(--bg);margin-bottom:10px}
.day ul{margin:.3em 0;padding-left:1.1em}.day li{margin:.25em 0}
.scroll{overflow-x:auto}
.gl dt{font-weight:600;margin-top:12px}
.gl dd{margin:2px 0 0;color:var(--muted);max-width:64ch}
.what{border:1.5px solid var(--line);border-top-width:6px;border-radius:14px;padding:14px 16px;background:var(--bg);margin-bottom:12px}
.what h3{margin-bottom:.2em}
.what .one{font-size:1.05rem;font-weight:600;margin:.2em 0 .6em;max-width:56ch}
.what ul{margin:.2em 0;padding-left:1.2em}.what li{margin:.3em 0;max-width:62ch}
.big3 p{margin:.5em 0}
table.cmp{width:100%;border-collapse:collapse;font-size:.92rem;min-width:520px}
table.cmp th,table.cmp td{border-top:1.5px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.cmp th{font-weight:600}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){body{font-size:16px}.panel{padding:18px 14px}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Which way?</div>
    <div class="mode" role="group" aria-label="Who is answering">
      <button type="button" data-act="mode" data-v="me" aria-pressed="true">I’m answering</button>
      <button type="button" data-act="mode" data-v="parent" aria-pressed="false">Parent view</button>
    </div>
  </div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <main id="main"></main>
</div>

 tcd:{s1:2,s2:3,s3:2,s4:3,p4:3,p1:2,p2:2,p3:2,p5:2,k1:1,w4:1,w5:1}
};

 marino:"The course and the career run in Irish, so it needs sustained enjoyment of working in Irish.",

 {id:"results",label:"Results"},{id:"try",label:"Try it"},{id:"cao",label:"CAO list"}
];

S.resetArm=false;

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function g(id){var v=S.a[id];return v==null?null:v}
function ans(){return S.mode==="parent"?S.pa:S.a}
function $(s){return document.querySelector(s)}

/* ---------- scoring ---------- */
function scoreOpt(key){
  var W=WEIGHTS[key],num=0,den=0,ups=[],downs=[],n=0,tot=0,id;
  for(id in W){
    tot++;var v=S.a[id];if(v==null)continue;n++;
    var w=W[id],aw=Math.abs(w),m=w<0?1-(v-1)/4:(v-1)/4;
    num+=aw*m;den+=aw;
    if(w>0&&!QMAP[id].rev){
      if(v>=4)ups.push({id:id,v:v,p:aw*m});
      else if(v<=2)downs.push({id:id,v:v,p:aw*(1-m)});
    }
  }
  var score=den?10*num/den:null,gate=false;
  if(key==="marino"&&score!=null&&((g("i1")!=null&&g("i1")<=2)||(g("i2")!=null&&g("i2")<=2))){gate=true;score=Math.min(score,4.5)}
  ups.sort(function(a,b){return b.p-a.p});downs.sort(function(a,b){return b.p-a.p});
  return {score:score,ups:ups,downs:downs,gate:gate,n:n,tot:tot};
}
function compute(){var r={};KEYS.forEach(function(k){r[k]=scoreOpt(k)});return r}
function orderByScore(){
  var r=compute();
  return KEYS.slice().sort(function(a,b){return (r[b].score==null?-1:r[b].score)-(r[a].score==null?-1:r[a].score)});
}

/* ---------- reality checks ---------- */
function checks(){
  var out=[],k1=g("k1"),k2=g("k2"),k3=g("k3"),p6=g("p6"),i1=g("i1"),i2=g("i2"),i4=g("i4"),s1=g("s1"),s2=g("s2"),p1=g("p1"),p2=g("p2"),p3=g("p3"),p5=g("p5"),w1=g("w1"),w2=g("w2"),w3=g("w3"),p4=g("p4");
  function add(t,b,a){out.push({t:t,b:b,a:a})}
  if(k1>=4&&k2!=null&&k2<=2)add("Liking kids and running a class of 25 are different things.","Plenty of people love children but find managing a whole room all day draining. Teaching is largely about leading a group, not just enjoying individual children.","When did you last have to keep a whole group of kids in order? How did that feel?");
  if(k1>=4&&k2>=4&&s2>=4&&p4>=4)add("You scored high for both worlds.","That’s a good problem to have, and it’s exactly why the “Try it” step matters. On paper you can’t separate them.","Which would you rather spend a whole day doing: leading a class, or assessing one person and planning their treatment?");
  if(s2!=null&&s2<=2)add("Speech and language therapy is a science degree first.","Expect anatomy, physiology, neurology and statistics from early on, and evidence-based reasoning throughout. If the appeal is “helping kids”, teaching and special education do that with far less science.","What is it about helping children communicate that appeals? Would you still want it with the science?");
  if(i1>=4&&i4!=null&&i4<=2)add("Exam Irish and spoken Irish are different skills.","You like Irish, but you don’t yet feel confident talking in it. A course taught almost entirely through Irish needs both the reading and writing and the everyday speaking.","What would a week of only speaking Irish be like for you?");
  if(i2!=null&&i2<=3)add("Marino is Irish nearly all day, for four years.","Lectures, reading, essays and placements are largely in Irish. A middling answer here is worth taking seriously, because it won’t change once the course starts.","Could you picture a bad-brain-day, tired Wednesday afternoon in Irish? Still happy?");
  if(S.gut&&S.gut[0]==="marino"&&S.gutSet&&((i1!=null&&i1<=3)||(i2!=null&&i2<=3)))add("Your gut put Marino first, but your Irish answers are lukewarm.","That mismatch is worth looking at. Is it the Irish you want, or something else about the course, like the points or the career?","If Marino and DCU had the same points, which would you pick, and why?");
  if(p1>=4&&k2>=4)add("You like small groups and running a big class. Which is it?","Primary teaching includes group work, but it is mostly whole-class. Speech and language therapy is mostly one-to-one or small groups.","Which do you picture when you imagine your best day at work?");
  if(p6!=null&&p6<=2&&k2!=null&&k2>=3)add("Primary classrooms are loud and constant.","If you need quiet to recharge, notice how you feel after an hour in a busy room full of children.","Spend a morning in a real classroom before deciding.");
  if(w1>=4)add("The holidays are real, but they’re not the whole story.","Teachers have long breaks, but planning, correcting, meetings and contact with parents spill outside the school day. Therapists in the health service have structured annual leave, not school holidays. Weigh this honestly.","If the holidays were the same in both, which would you choose?");
  if(p2!=null&&p2<=2&&s2!=null&&s2>=3)add("Speech and language therapy isn’t only hospitals.","Placements and jobs include schools, community clinics and early-intervention teams as well as hospitals, but clinical settings are part of the work.","Is it hospitals you dislike, or something about them? (smell, illness, noise)");
  if(p5!=null&&p5<=2)add("Therapy work can be emotionally heavy.","Speech and language therapists work with people who’ve had strokes, who live with disability, or who struggle to swallow. Teachers also meet tough situations, but the clinical side is a different kind of intensity.","How do you cope when someone you care about is struggling?");
  if(k1>=4&&p3>=4&&s2>=3)add("You might enjoy the breadth of speech and language therapy.","It lets you work with children and adults, in lots of settings, and you’re signalling you’d like that variety.","Do you want to work only with children, or is variety part of the appeal?");
  if(w2>=4)add("Job security isn’t a clear difference between these.","Both are regulated professions with real demand in Ireland, though early careers in each can include temporary or contract work. Check the current picture.","If security is roughly equal, what separates them for you?");
  if(w3>=4)add("Both qualifications travel, with caveats.","Teachers register with the Teaching Council, and therapists with CORU. Working abroad depends on the country’s recognition, and Irish-medium teaching is narrower. Check this before leaning on it.","Where would you realistically like to live in ten years?");
  return out;
}
function wordChecks(){
  var out=[],t=S.t;
  if(t.whySLT&&/\b(play|fun|cute|games?)\b/i.test(t.whySLT))out.push({q:"whySLT",t:"Is it really mostly play?",b:"Sessions can look like play, but the job is clinical: assessing, working out the cause, tracking evidence, writing reports and working with families. Does that still appeal?"});
  if(t.whyTeach&&/\b(holiday|summer|off)\b/i.test(t.whyTeach))out.push({q:"whyTeach",t:"The holidays came up.",b:"They’re a real perk. But what would you enjoy about the other 190 or so days? Describe a Tuesday in February."});
  if(t.whyIrish&&/\b(points?|bonus)\b/i.test(t.whyIrish))out.push({q:"whyIrish",t:"Bonus points are a reason to sit the TEG.",b:"They’re not a reason to spend four years studying in Irish. If points are the main thing, it’s worth saying so out loud."});
  if(t.whySLT&&/\b(only|just|mainly)\b.*\bkids?|children\b/i.test(t.whySLT)&&(g("p3")!=null&&g("p3")<=2))out.push({q:"whySLT",t:"Adults are a big part of the job.",b:"Many therapists work mostly with adults after strokes or with neurological conditions. If you’d only want children, ask a therapist how much choice you have."});
  return out;
}
function parentDiffs(){
  var d=[];ALLQ.forEach(function(q){var a=S.a[q.id],b=S.pa[q.id];if(a!=null&&b!=null&&Math.abs(a-b)>=2)d.push({q:q,a:a,b:b})});return d;
}

function viewResults(){
  var R=compute(),answered=Object.keys(S.a).length,total=ALLQ.length;
  var h="<div class='panel'><h2>Your results</h2>";
  if(!answered){return h+"<p class='lede'>You haven’t answered any questions yet. Go back to the Kids step and start rating, and your results will appear here.</p><div class='foot'><button class='btn ghost' type='button' data-act='go' data-i='"+stepIndex("kids")+"'>Go to Kids</button><span></span></div></div>"}
  h+="<p class='lede'>You’ve answered "+answered+" of "+total+" questions. These scores are conversation starters. They aren’t a decision.</p>";
  var order=KEYS.filter(function(k){return R[k].score!=null}).sort(function(a,b){return R[b].score-R[a].score});
  KEYS.slice().sort(function(a,b){return (R[b].score==null?-1:R[b].score)-(R[a].score==null?-1:R[a].score)}).forEach(function(k){
    var o=OPT[k],r=R[k];
    if(r.score==null){h+="<div class='score'><h3>"+esc(o.short)+"</h3><p>Not enough answers yet to score this one.</p></div>";return}
    var worst=r.downs.length?("Weaker match: "+QMAP[r.downs[0].id].short+" (you gave "+r.downs[0].v+" out of 5)"):DEFAULT_RES[k];
    h+="<div class='score' style='border-top:6px solid "+o.color+"'><header><h3><span class='dot' style='background:"+o.color+"'></span>"+esc(o.short)+"</h3><div class='num'>"+r.score.toFixed(1)+"<small> / 10</small></div></header>"+
    "<div class='bar'><i style='width:"+(r.score*10)+"%;background:"+o.color+"'></i></div>";
    if(r.ups.length){h+="<b>Pulling it up</b><ul>"+r.ups.slice(0,3).map(function(u){return "<li>You’re drawn to "+esc(QMAP[u.id].short)+" ("+u.v+" out of 5)</li>"}).join("")+"</ul>"}
    h+="<b>Biggest reservation</b><ul><li>"+esc(worst)+"</li></ul>";
    if(r.gate)h+="<div class='callout'><strong>The Irish answers cap this score.</strong><p>Rating Irish at 2 or lower means this course would be a daily struggle against what it demands. If that changes after a week of speaking Irish, answer again.</p></div>";

    h+="</div>";
  });
  if(order.length>=2){

    h+="<p><b>On paper:</b> "+esc(OPT[top].short)+" fits best, with "+esc(OPT[second].short)+" next."+(gap<0.8?" They’re close, so don’t read the gap as meaningful. That’s what the “Try it” step is for.":"")+"</p>";
    if(S.gutSet){

    }
  }
  h+="</div>";

  var ch=checks();
  if(ch.length){h+="<div class='panel'><h2>Let’s poke at your answers</h2><p class='lede'>Places where a reason might not match what the job is really like. Not a telling-off. Just worth a conversation.</p>"+
    ch.map(function(c){return "<div class='callout'><strong>"+esc(c.t)+"</strong><p>"+esc(c.b)+"</p><p class='ask'>Talk about it: "+esc(c.a)+"</p></div>"}).join("")+"</div>"}

  var wc=wordChecks(),said=WORDS.filter(function(w){return S.t[w.id]&&S.t[w.id].trim()&&/^(why|dealbreakers|dread)/.test(w.id)}).concat(S.t.futureReact&&S.t.futureReact.trim()?[{id:"futureReact",label:"Which parts of the future roadmap made you lean in, and which made you wince?"}]:[]);

  else if(Object.keys(S.pa).length){h+="<div class='panel'><h2>Where you two see things differently</h2><p>Nothing differs by 2 or more so far. Either you’re well aligned, or there are questions the parent hasn’t answered yet.</p></div>"}

  h+="<div class='panel'><h2>Myth and reality</h2>"+
  "<details><summary>Teaching</summary><p>It’s not nine to three. Planning, correcting, meetings and contact with parents happen outside class time. Many new teachers also start on subbing or temporary contracts before a permanent post, which varies by year and area. Ask a teacher what it looks like now.</p></details>"+
  "<details><summary>Speech and language therapy</summary><p>Sessions with children can look like play, but the work is clinical: assessing, working out what’s causing a difficulty, tracking evidence, writing reports and working with families and other professionals. Many therapists work mostly with adults, such as after a stroke. Expect anatomy, physiology, neurology and statistics in the degree.</p></details>"+
  "<details><summary>Marino through Irish</summary><p>B1 is a conversational level, not fluency. The course then runs almost entirely in Irish, including academic reading and writing, and placements are in Irish-medium schools. Check what the qualification allows in English-medium schools, and how the Teaching Council handles it, so you know your options.</p></details>"+
  "<details><summary>Points</summary><p>Round 1 points in 2026 were about 473 for DC002, 503 for CM003 (including the 40 TEG points, so roughly 463 from the Leaving Cert itself) and 555 for TR007. Those change every year and aren’t predictions. CAO offers you the highest preference you qualify for, so listing a “reach” course first costs you nothing if you list courses you’d also love below it. That’s why the order should follow what you want.</p>"+

  h+=foot("Try before you decide");

}

function summaryText(){
  var R=compute(),L=[];
  L.push("WHICH WAY? SUMMARY","");
  L.push("Fit scores (out of 10, from her answers):");
  KEYS.forEach(function(k){L.push("- "+OPT[k].short+": "+(R[k].score==null?"not enough answers":R[k].score.toFixed(1)))});
  if(S.gutSet)L.push("","Gut ranking: "+S.gut.map(function(k){return OPT[k].short}).join(" > "));
  if(S.band)L.push("Points guess: "+bandLabel()+". Risk appetite: "+S.risk+" out of 5 (5 = dream first).");
  L.push("","Provisional CAO order:");
  [8,7].forEach(function(lv){var ids=S.cao.filter(function(x){return CAOITEMS[x].level===lv});if(ids.length){L.push(lv===8?"Level 8:":"Level 7/6:");ids.forEach(function(x,i){L.push("  "+(i+1)+". "+CAOITEMS[x].name)})}});
  if(S.why&&S.why.trim())L.push("","Why the first choice is first: "+S.why.trim());
  var undone=TRY.filter(function(t){return !S.checks[t.id]});
  if(undone.length)L.push("","Still to try: "+undone.map(function(t){return t.t.replace(/\.$/,"")}).join("; "));
  return L.join("\n");
}

function viewExplain(){

  h+="<div class='panel big3'><h2>The three big questions</h2><p><b>Teaching:</b> would you enjoy having your own class of about 25 children, seeing them every day, teaching many subjects, managing a classroom and building relationships with the same children over a school year?</p><p><b>Speech and language therapy:</b> would you prefer working one-to-one or with small groups, assessing a particular communication difficulty, understanding what’s causing it, making a treatment plan and working with the person?</p><p><b>Marino through Irish:</b> on top of wanting to be a teacher, do you love Irish enough to enjoy studying and working through it every day?</p><p class='note'>The rest of this workbook is built to help you answer these honestly.</p></div>";

 {k:"marino",title:"A Tuesday as a teacher in an Irish-medium school",items:["The same day shape as above, but Irish is the language of everything: lessons, yard, staffroom and notes home.","You’d be the Irish-speaking adult many children hear most. That’s a joy for some people and a weight for others."]},
 {k:"tcd",title:"A Tuesday as a speech and language therapist",items:["8:45  Team meeting with the occupational therapist, physiotherapist and psychologist.","9:30  Assess a three-year-old with a language delay, with a parent in the room.","11:00  A therapy session using a game to practise sounds, noting what works.","12:30  Lunch, then writing up the assessment.","1:30  Depending on your service: a swallowing assessment for an adult after a stroke, or a school visit.","3:30  Reports, goals for the family, a phone call to the child’s teacher.","4:30  Caseload and waiting-list decisions."]}
];
var MONEY=[
 ["Pay at the start","Starts at the bottom of the new-entrant primary scale, in the mid-€40,000s (2026).","The same scale.","Starts at the bottom of the HSE staff grade scale, which ran about €45.5k to €65k in mid-2026."],
 ["Pay later","A long scale. It takes many years to reach the top, in the low to mid €80,000s.","The same.","Senior grade ran about €64.5k to €76k (HSE job ads, early 2026), with further grades above."],
 ["Hours and holidays","School-year pattern with long breaks. Planning, marking and meetings spill beyond the school day.","The same.","Posts I found were advertised at 35 hours a week with standard HSE annual leave, not school holidays."],
 ["Registered with","Teaching Council","Teaching Council","CORU"],
 ["First job","Substitute, temporary or permanent post in a primary school, with Droichead induction.","Irish-medium or English-medium schools, with Droichead induction.","Staff grade post in HSE or a voluntary service. Campaigns have been open to graduating students."]
];
function viewFuture(){
  var h="<div class='panel'><h2>What it could look like</h2><p class='lede'>Three lives from the same starting line. These are possibilities drawn from course pages, job ads and pay scales, not promises. Read across a row to compare the same age.</p>";
  FUT.forEach(function(r){
    h+="<div class='tl'><div class='when'>"+esc(r.when)+"<small>"+esc(r.sub)+"</small></div><div class='lanes'>"+KEYS.map(function(k){return "<div class='lane' style='border-left-color:"+OPT[k].color+"'><b>"+esc(OPT[k].short)+"</b>"+esc(r[k])+"</div>"}).join("")+"</div></div>";
  });
  h+="</div><div class='panel'><h2>A day in each, imagined</h2><p class='lede'>A made-up composite, not data. Real days depend on the school or service. Ask yourself which one you’d rather walk into at 8:30 on a wet Monday.</p>"+
  DAYS.map(function(d){return "<div class='day' style='border-top-color:"+OPT[d.k].color+"'><h3>"+esc(d.title)+"</h3><ul>"+d.items.map(function(i){return "<li>"+esc(i)+"</li>"}).join("")+"</ul></div>"}).join("")+"</div>";
  h+="<div class='panel'><h2>Money, time and registration</h2><div class='scroll'><table class='cmp'><thead><tr><th></th>"+KEYS.map(function(k){return "<th>"+esc(OPT[k].short)+"</th>"}).join("")+"</tr></thead><tbody>"+
  MONEY.map(function(r){return "<tr><th>"+esc(r[0])+"</th><td>"+esc(r[1])+"</td><td>"+esc(r[2])+"</td><td>"+esc(r[3])+"</td></tr>"}).join("")+"</tbody></table></div>"+
  "<p class='note' style='margin-top:10px'>Pay scales change with public-sector agreements, so treat these as a rough guide. Sources:</p><div class='links'>"+
  A("Dept of Education circular on primary teacher pay, June 2026","https://www.gov.ie/en/department-of-education/circulars/circular-0055-2026-primary-teacher-salaries-effective-from-1st-june-2026/")+
  A("Permanent contracts after one year","https://www.gov.ie/en/department-of-education/press-releases/minister-mcentee-announces-new-policy-measures-to-boost-teacher-supply-including-permanent-contracts-after-one-year")+
  A("Droichead induction","https://teachingcouncil.ie/register/droichead/the-droichead-process-primary")+"</div></div>";
  h+="<div class='panel'><h2>Your reaction</h2><div class='field'><label for='fr'>Which parts of the roadmap made you lean in, and which made you wince? Be specific.</label><textarea id='fr' data-t='futureReact'>"+esc(S.t.futureReact||"")+"</textarea></div>"+foot("Start the questions")+"</div>";
  return h;
}

/* ---------- render ---------- */
function render(keepScroll){
  var cur=STEPS[S.step],stepsEl=$("#steps");
  stepsEl.innerHTML=STEPS.map(function(s,i){return "<button type='button' data-act='go' data-i='"+i+"'"+(i===S.step?" aria-current='step'":"")+(i<S.step?" class='done'":"")+">"+esc(s.label)+"</button>"}).join("");
  var m=$("#main"),sec=null;
  SECTIONS.forEach(function(s){if(s.id===cur.id)sec=s});
  var html;
  if(cur.id==="welcome")html=viewWelcome();
  else if(cur.id==="explain")html=viewExplain();
  else if(cur.id==="courses")html=viewCourses();
  else if(cur.id==="future")html=viewFuture();
  else if(sec)html=viewSection(sec);
  else if(cur.id==="words")html=viewWords();
  else if(cur.id==="gut")html=viewGut();
  else if(cur.id==="results")html=viewResults();
  else if(cur.id==="try")html=viewTry();
  else html=viewCao();
  m.innerHTML=html;
  document.querySelectorAll(".mode button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-v")===S.mode))});
  var active=stepsEl.querySelector("[aria-current]");if(active&&active.scrollIntoView)try{active.scrollIntoView({inline:"center",block:"nearest"})}catch(e){}
  if(!keepScroll)window.scrollTo(0,0);
}
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));S.resetArm=false;save();render()}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="go")return go(+el.getAttribute("data-i"));
  if(act==="next")return go(S.step+1);
  if(act==="back")return go(S.step-1);
  if(act==="ctab"){S.ctab=el.getAttribute("data-k");save();return render(true)}
  if(act==="mode"){S.mode=el.getAttribute("data-v");save();return render(true)}
  if(act==="scale"){
    var id=el.getAttribute("data-q"),v=+el.getAttribute("data-v");ans()[id]=v;save();
    el.parentNode.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String(b===el))});return;
  }
  if(act==="risk"){S.risk=+el.getAttribute("data-v");save();el.parentNode.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String(b===el))});return}
  if(act==="gut"){
    var k=el.getAttribute("data-k"),d=+el.getAttribute("data-d"),i=S.gut.indexOf(k),j=i+d;
    if(j<0||j>=S.gut.length)return;var t=S.gut[i];S.gut[i]=S.gut[j];S.gut[j]=t;S.gutSet=true;S.caoInit=false;save();render(true);
    var nb=document.querySelector("[data-act='gut'][data-k='"+k+"'][data-d='"+d+"']");if(nb&&!nb.disabled)nb.focus();else{var other=document.querySelector("[data-act='gut'][data-k='"+k+"']:not([disabled])");if(other)other.focus()}
    return;
  }
  if(act==="cmove"){
    var cid=el.getAttribute("data-id"),dd=+el.getAttribute("data-d"),lvl=CAOITEMS[cid].level;
    var ids=S.cao.filter(function(x){return CAOITEMS[x].level===lvl}),ii=ids.indexOf(cid),jj=ii+dd;
    if(jj<0||jj>=ids.length)return;
    var a=S.cao.indexOf(ids[ii]),b=S.cao.indexOf(ids[jj]),tmp=S.cao[a];S.cao[a]=S.cao[b];S.cao[b]=tmp;save();render(true);
    var f=document.querySelector("[data-act='cmove'][data-id='"+cid+"'][data-d='"+dd+"']");if(f&&!f.disabled)f.focus();return;
  }
  if(act==="cdel"){S.cao=S.cao.filter(function(x){return x!==el.getAttribute("data-id")});save();return render(true)}
  if(act==="cadd"){S.cao.push(el.getAttribute("data-id"));save();return render(true)}
  if(act==="csuggest"){
    var add=[];function want(x){if(S.cao.indexOf(x)<0&&add.indexOf(x)<0)add.push(x)}
    var kk=Math.max(g("k1")||0,g("k2")||0),sc=Math.max(g("s1")||0,g("s2")||0);
    if(kk>=4||(!kk&&!sc)){want("mic005");want("froebel");want("mic008")}
    if(sc>=3||(!kk&&!sc)){want("ucc");want("gal");want("ul")}
    if((g("i1")||0)>=4)want("artsIrish");
    want("ece7");
    S.cao=S.cao.concat(add);save();return render(true);
  }
  if(act==="copy"){
    var ta=$("#sum"),msg=$("#copymsg");ta.select();
    var ok=false;try{ok=document.execCommand&&document.execCommand("copy")}catch(err){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(function(){msg.textContent="Copied."},function(){msg.textContent="Couldn’t copy automatically. The text is selected, so press Ctrl+C or Cmd+C."});return}
    msg.textContent=ok?"Copied.":"Couldn’t copy automatically. The text is selected, so press Ctrl+C or Cmd+C.";return;
  }
  if(act==="reset"){
    if(!S.resetArm){S.resetArm=true;return render(true)}
    try{localStorage.removeItem(STORE)}catch(err){}
    S={step:0,mode:"me",a:{},pa:{},t:{},gut:KEYS.slice(),gutSet:false,ctab:"dcu",band:"",risk:3,cao:[],caoInit:false,checks:{},why:"",resetArm:false};render();
  }
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.hasAttribute("data-t")){S.t[el.getAttribute("data-t")]=el.value;save()}
  else if(el.hasAttribute("data-why")){S.why=el.value;save();var s=$("#sum");if(s)s.value=summaryText()}
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.hasAttribute("data-sel")){S.band=el.value;save()}
  else if(el.hasAttribute("data-chk")){S.checks[el.getAttribute("data-chk")]=el.checked;save();render(true)}
});

render();
})();
</script>
</body>
</html>
